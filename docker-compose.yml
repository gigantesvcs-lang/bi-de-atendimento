version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: gigante-bi:latest
    container_name: gigante_bi_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./dev.db
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=super-secret-key-for-local-dev-12345
